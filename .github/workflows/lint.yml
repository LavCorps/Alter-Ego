name: Deno Lint
on: [push, pull_request]

permissions:
  contents: read

jobs:
  deno-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno Lint
        run: deno lint
